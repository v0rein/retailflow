version: 2

models:
  - name: dim_customers
    description: "One row per Olist customer_id (order-scoped customer key)"
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        data_tests:
          - not_null

  - name: dim_products
    description: "Products enriched with English category names"
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: dim_sellers
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique

  - name: dim_dates
    columns:
      - name: date_id
        data_tests:
          - not_null
          - unique

  - name: fact_orders
    description: "One row per order with item, payment, review, and delivery measures"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: total_revenue
        data_tests:
          - not_null
      - name: purchase_date_id
        data_tests:
          - relationships:
              to: ref('dim_dates')
              field: date_id
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['created', 'approved', 'delivered', 'shipped', 'canceled', 'invoiced', 'processing', 'unavailable']

  - name: fact_order_items
    description: "One row per order line item"
    columns:
      - name: order_item_key
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              to: ref('fact_orders')
              field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_id
      - name: price
        data_tests:
          - not_null
