version: 2

models:
  - name: stg_orders
    description: "Staged orders from the Silver layer"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - unique
      - name: customer_id
        data_tests:
          - not_null
      - name: order_status
        data_tests:
          - accepted_values:
              values: ['created', 'approved', 'delivered', 'shipped', 'canceled', 'invoiced', 'processing', 'unavailable']

  - name: stg_order_items
    description: "Staged order items with item prices and freight values"
    columns:
      - name: order_item_key
        data_tests:
          - not_null
          - unique
      - name: order_id
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: seller_id
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null

  - name: stg_customers
    columns:
      - name: customer_id
        data_tests:
          - not_null
          - unique
      - name: customer_unique_id
        data_tests:
          - not_null

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests:
          - not_null
          - unique

  - name: stg_payments
    description: "One row per (order_id, payment_sequential); an order can be paid in several parts"
    data_tests:
      - unique:
          column_name: "order_id || '_' || payment_sequential"
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: payment_type
        data_tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined']

  - name: stg_reviews
    description: "One row per (review_id, order_id); one Olist review can cover several orders"
    data_tests:
      - unique:
          column_name: "review_id || '_' || order_id"
    columns:
      - name: review_id
        data_tests:
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: review_score
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5]
