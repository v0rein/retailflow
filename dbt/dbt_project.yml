name: 'retailflow'
version: '1.0.0'
config-version: 2

profile: 'retailflow_duckdb'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  retailflow:
    staging:
      +materialized: view
    marts:
      +materialized: table
    aggregates:
      +materialized: table
