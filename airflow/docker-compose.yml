services:
  airflow-standalone:
    build:
      context: ..
      dockerfile: airflow/Dockerfile
    image: retailflow-airflow:2.9.1
    container_name: retailflow-airflow
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION=False
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=UTC
      - PYTHONPATH=/opt/airflow
      - USE_LOCAL_STORAGE=true
      - LOCAL_LAKEHOUSE_ROOT=/opt/airflow/data/lakehouse
      # Failure alerts: values come from the host environment, or from the repo
      # .env via `docker compose --env-file ../.env up`. Unset means no email,
      # and the DAG still parses.
      - ALERT_EMAIL=${ALERT_EMAIL:-}
      - AIRFLOW__SMTP__SMTP_HOST=${AIRFLOW__SMTP__SMTP_HOST:-localhost}
      - AIRFLOW__SMTP__SMTP_PORT=${AIRFLOW__SMTP__SMTP_PORT:-587}
      - AIRFLOW__SMTP__SMTP_USER=${AIRFLOW__SMTP__SMTP_USER:-}
      - AIRFLOW__SMTP__SMTP_PASSWORD=${AIRFLOW__SMTP__SMTP_PASSWORD:-}
      - AIRFLOW__SMTP__SMTP_MAIL_FROM=${AIRFLOW__SMTP__SMTP_MAIL_FROM:-}
      - AIRFLOW__SMTP__SMTP_STARTTLS=${AIRFLOW__SMTP__SMTP_STARTTLS:-True}
      - AIRFLOW__SMTP__SMTP_SSL=${AIRFLOW__SMTP__SMTP_SSL:-False}
    volumes:
      - ./dags:/opt/airflow/dags
      - ../dbt:/opt/airflow/dbt
      - ../data:/opt/airflow/data
      - ../ingestion:/opt/airflow/ingestion
      - ../spark_jobs:/opt/airflow/spark_jobs
      # Keeps the Delta Lake jars Spark downloads from Maven, so later runs
      # (and runs without internet) skip the download.
      - ivy-cache:/home/airflow/.ivy2
    ports:
      - "8080:8080"
    command: standalone

volumes:
  ivy-cache:
